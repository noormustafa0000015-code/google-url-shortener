
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Viewer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            height: 100vh;
            overflow: hidden;
        }

        .viewer {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            min-height: 58px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .brand {
            font-size: 16px;
            font-weight: 700;
            color: #172033;
        }

        .open-button {
            padding: 10px 16px;
            border-radius: 8px;
            background: #315efb;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .frame-container {
            flex: 1;
            position: relative;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
        }

        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
            color: #475569;
            z-index: 2;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #dbeafe;
            border-top-color: #315efb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        .notice {
            padding: 9px 14px;
            background: #fff7ed;
            color: #9a3412;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 500px) {
            .toolbar {
                padding: 10px;
            }

            .brand {
                font-size: 14px;
            }

            .open-button {
                padding: 9px 11px;
            }
        }
    </style>
</head>

<body>

    <main class="viewer">

        <header class="toolbar">
            <div class="brand">Website Viewer</div>

            <a
                id="openOriginal"
                class="open-button"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Open Original
            </a>
        </header>

        <div class="notice">
            External website displayed where embedding is permitted.
        </div>

        <section class="frame-container">

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading website...</p>
            </div>

            <iframe
                id="websiteFrame"
                title="External website"
                referrerpolicy="no-referrer"
                allowfullscreen
            ></iframe>

        </section>

    </main>

    <script>
        "use strict";

        const params = new URLSearchParams(window.location.search);

        const destination = params.get("url");

        const frame = document.getElementById("websiteFrame");
        const loading = document.getElementById("loading");
        const openOriginal = document.getElementById("openOriginal");

        function validateDestination(value) {
            try {
                const url = new URL(value);

                return (
                    url.protocol === "https:" &&
                    !url.username &&
                    !url.password &&
                    !url.port &&
                    url.hostname.includes(".") &&
                    !url.hostname.startsWith("[") &&
                    !/^\d{1,3}(\.\d{1,3}){3}$/.test(url.hostname) &&
                    url.hostname !== "localhost" &&
                    !url.hostname.endsWith(".localhost") &&
                    !url.hostname.endsWith(".local") &&
                    !url.hostname.endsWith(".internal")
                );
            } catch {
                return false;
            }
        }

        if (!destination || !validateDestination(destination)) {

            loading.innerHTML = "<p>Invalid or missing website URL.</p>";

        } else {

            const hostname = new URL(destination).hostname.toLowerCase();

            // Known domains that should open directly.
            const blockedDomains = [
                "google.com"
            ];

            const isBlockedDomain = blockedDomains.some(domain => {
                return hostname === domain || hostname.endsWith("." + domain);
            });

            if (isBlockedDomain) {

                // Google does not permit this type of iframe embedding.
                // Open the original website directly.
                window.location.replace(destination);

            } else {

                openOriginal.href = destination;

                frame.addEventListener("load", function () {
                    loading.classList.add("hidden");
                });

                frame.src = destination;
            }
        }
    </script>

</body>
</html>
